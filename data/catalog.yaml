  - {id: DIA,   source: yahoo, symbol: "DIA",   role: equity_etf,     notes: "Dow, desde 1998."}
  - {id: IWM,   source: yahoo, symbol: "IWM",   role: equity_etf,     notes: "Small caps, desde 2000-05."}
  - {id: RSP,   source: yahoo, symbol: "RSP",   role: breadth_proxy,  notes: "S&P 500 igual ponderado, desde 2003-05. RSP/SPY es un proxy de amplitud, NO amplitud real."}
  - {id: EFA,   source: yahoo, symbol: "EFA",   role: equity_intl,    notes: "Desarrollados ex-EE.UU., desde 2001-08."}
