  - {id: SPY,   source: yahoo, symbol: "SPY",   role: equity_etf,     notes: "Desde 1993-01. Usar adj_close para retorno total."}
  - {id: IXIC,  source: yahoo, symbol: "^IXIC", role: equity_index,   notes: "Nasdaq Composite, precio. Desde 1990."}
