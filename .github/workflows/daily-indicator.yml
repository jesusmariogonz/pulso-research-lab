name: Indicador diario de estrés

# DESACTIVADO (17-nov-2026): por decisión del autor, el indicador de EXP-001 dejó de
# actualizarse. El medidor se retiró de la página principal de Pulso de Mercado y su
# última lectura quedó congelada en la página del experimento. Se quitó el `schedule`;
# el workflow solo puede correrse a mano (workflow_dispatch). Para reactivarlo, restaurar:
#   schedule:
#     - cron: "30 12 * * 1-5"
# Calcula el indicador a partir de los datos públicos y publica public/emergency/latest.json
# e history.json. Cómputo puro: sin LLM, sin llaves. Informativo y EXPERIMENTAL (ver EXP-001).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indicador:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Calcular el indicador con datos frescos
        run: python -c "from prl.emergency.daily import main; main()"
      - name: Publicar los JSON
        run: |
          git config user.name "prl-bot"
          git config user.email "prl-bot@users.noreply.github.com"
          git add public/emergency/latest.json public/emergency/history.json
          git diff --cached --quiet && { echo "Sin cambios"; exit 0; }
          git commit -m "Indicador diario de estrés $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
