name: EXP-005 — Forward validation check

# Validación forward del bucket CONGELADO de EXP-005 (Reverse Winners).
# No descubre ni reoptimiza nada — ver experiments/EXP-005-reverse-winners/
# FORWARD_VALIDATION.md. Corre semanalmente (domingos, 2h después de
# data-build.yml, para tener precios recién refrescados) y bajo demanda.
# La mayoría de las corridas no encuentran ninguna fecha de corte nueva
# con retorno de 30 días completo (solo existe una cada ~10 sesiones
# hábiles) y terminan sin commitear nada — es el resultado esperado, no
# un error. Cómputo puro: sin LLM, sin llaves.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * 0"

permissions:
  contents: write

jobs:
  forward-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Traer datos congelados (último Release data-*)
        run: |
          TAG=$(gh release list --limit 30 --json tagName -q '.[] | select(.tagName | startswith("data-")) | .tagName' | head -1)
          test -n "$TAG" || { echo "No hay Release de datos: corre primero 'Construir base de datos'"; exit 1; }
          mkdir -p dl data
          gh release download "$TAG" -p data-raw.tar.gz -p manifest.json -D dl
          tar -xzf dl/data-raw.tar.gz -C data
          cp dl/manifest.json data/manifest.json
          python -m prl.data.build --verify
      - name: Aplicar el bucket congelado sobre fechas nuevas (si existen)
        run: python scripts/exp005_forward_check.py
      - name: Commitear el log y el reporte, solo si hay cambios
        run: |
          git config user.name "prl-bot"
          git config user.email "prl-bot@users.noreply.github.com"
          # Primera corrida: estos archivos todavía no existen (la rutina no
          # encontró fechas nuevas todavía) — git add falla duro sobre un
          # pathspec inexistente, así que solo se agregan si ya existen.
          for f in experiments/EXP-005-reverse-winners/run_forward/log.json \
                   experiments/EXP-005-reverse-winners/FORWARD_VALIDATION_RESULTADOS.md; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && { echo "Sin fechas nuevas: nada que commitear"; exit 0; }
          git commit -m "EXP-005 forward validation: fechas nuevas $(date -u +%Y-%m-%d)"
          # El manifiesto del Release descargado arriba puede no coincidir
          # byte a byte con el data/manifest.json ya trackeado en main (se
          # pisó solo para que --verify tuviera con qué comparar) — eso deja
          # un cambio sin stagear que rompe "pull --rebase" (visto en
          # exp005-paper-portfolio.yml). Se descarta: nunca fue intención de
          # esta corrida tocar ese archivo.
          git checkout -- data/manifest.json 2>/dev/null || true
          git pull --rebase origin main
          git push
